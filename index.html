<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>KinPause — Hôtels près de vous</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg-deep: #121212; --panel: #1A1A1A; --card: #232323; --card-hi: #2C2C2C;
    --accent: #FFFFFF; --text: #FFFFFF; --text-muted: rgba(255,255,255,0.55); --border: rgba(255,255,255,0.14);
    --loc-blue: #2582FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: 'IBM Plex Sans', -apple-system, sans-serif; color: var(--text); overflow: hidden; position: fixed; inset: 0; background: var(--bg-deep); }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  input { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #errorBanner { position: fixed; top: 0; left: 0; right: 0; z-index: 999; background: #C23B2B; color: white; font-family: monospace; font-size: 11px; padding: 8px 12px; display: none; word-break: break-word; }
  #kpToast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); background: #FFFFFF; color: #121212; padding: 13px 20px; border-radius: 12px; font-size: 12.5px; font-weight: 600; max-width: 85vw; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; }
  #kpToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #onboarding { position: fixed; inset: 0; z-index: 150; display: flex; flex-direction: column; justify-content: center; background: var(--bg-deep); padding: 34px 26px; overflow-y: auto; }
  .ob-mark { width: 50px; height: 50px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(255,255,255,0.15); }
  .ob-eyebrow { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 8px; }
  .ob-title { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
  .ob-sub { color: var(--text-muted); font-size: 13.5px; margin-bottom: 28px; line-height: 1.5; }
  .ob-label { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 7px; margin-top: 18px; letter-spacing: 0.02em; }
  .ob-input { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 15px; color: var(--text); font-size: 14.5px; transition: border-color 0.15s ease; }
  .ob-input:focus { outline: none; border-color: var(--accent); }
  .ob-error { color: #FF6B5B; font-size: 12.5px; margin-top: 11px; min-height: 16px; }
  .ob-btn { width: 100%; margin-top: 22px; padding: 16px; background: var(--accent); color: #121212; border-radius: 12px; font-weight: 700; font-size: 14.5px; transition: transform 0.15s ease; }
  .ob-btn:active { transform: scale(0.97); }
  .ob-note { margin-top: 18px; font-size: 11.5px; color: var(--text-muted); line-height: 1.55; background: var(--card); padding: 13px 15px; border-radius: 12px; }

  #map { position: fixed; inset: 0; z-index: 0; background: var(--bg-deep); display: none; }
  .leaflet-tile-pane { filter: invert(93%) hue-rotate(213deg) brightness(0.87) contrast(0.92) saturate(0.85); }
  .leaflet-control-attribution { font-size: 9px !important; opacity: 0.5; background: rgba(0,0,0,0.4) !important; color: #ccc !important; }
  .leaflet-control-attribution a { color: #ddd !important; }

  #introOverlay { position: fixed; inset: 0; z-index: 200; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s ease, visibility 0.5s ease; }
  #introOverlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-mark { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3A3A3A, var(--bg-deep) 72%); box-shadow: 0 0 50px 8px rgba(255,255,255,0.1); animation: introPulse 1.6s ease-in-out infinite; }
  @keyframes introPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .intro-mark { animation: none; } }

  #topBar { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 46; display: none; align-items: center; gap: 9px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.5); flex-shrink: 0; transition: transform 0.15s ease; }
  .avatar:active { transform: scale(0.92); }
  .brand-label { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; background: rgba(18,18,18,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 9px 15px; border-radius: 100px; border: 1px solid var(--border); }

  #headerMenu { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 56px)); left: 16px; z-index: 45; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 14px 44px rgba(0,0,0,0.6); padding: 8px; min-width: 240px; display: none; flex-direction: column; gap: 2px; }
  #headerMenu.show { display: flex; }
  .menu-item { display: flex; align-items: center; gap: 13px; padding: 12px 13px; border-radius: 11px; font-size: 13.5px; text-align: left; width: 100%; transition: background 0.12s ease; }
  .menu-item:active { background: var(--card); }
  .menu-item svg { width: 18px; height: 18px; color: var(--text); flex-shrink: 0; }
  .menu-divider { height: 1px; background: var(--border); margin: 4px 6px; }

  #locateBtn { position: fixed; right: 16px; bottom: 30px; z-index: 40; display: none; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(0,0,0,0.4); align-items: center; justify-content: center; transition: opacity 0.2s ease, transform 0.2s ease, bottom 0.3s ease; }
  #locateBtn:active { transform: scale(0.92); }
  #locateBtn.hidden { opacity: 0; transform: scale(0.8); pointer-events: none; }
  #locateBtn.raised { bottom: 212px; }
  #locateBtn.loading svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #locateBtn.loading svg { animation: none; } }

  .user-marker-wrap { width: 26px; height: 26px; position: relative; }
  .user-marker-pulse { position: absolute; inset: -11px; border-radius: 50%; background: rgba(37,130,255,0.32); animation: pulse 2.2s infinite ease-out; }
  .user-marker-dot { position: absolute; inset: 3px; border-radius: 50%; background: var(--loc-blue); border: 3px solid #FFFFFF; box-shadow: 0 0 10px 2px rgba(37,130,255,0.6); }
  @keyframes pulse { 0% { transform: scale(0.5); opacity: 0.9; } 100% { transform: scale(2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .user-marker-pulse { animation: none; opacity: 0.3; } }

  .hotel-badge-wrap { pointer-events: none !important; }
  .hotel-badge { width: 30px; height: 30px; border-radius: 50%; background: rgba(18,18,18,0.88); border: 1.5px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.55); }
  .hotel-badge svg { width: 17px; height: 17px; }
  .hotel-label, .leaflet-tooltip.hotel-label { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 0 0 4px !important; color: #FFFFFF !important; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.75); white-space: nowrap; }
  .hotel-label::before { display: none !important; }
  .hotspot-label, .leaflet-tooltip.hotspot-label { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; color: rgba(255,255,255,0.6) !important; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 10px; text-shadow: 0 1px 3px rgba(0,0,0,0.9); white-space: nowrap; }
  .hotspot-label::before { display: none !important; }

  #sheet { position: fixed; left: 0; right: 0; bottom: 0; display: none; background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); transition: height 0.32s cubic-bezier(0.4,0,0.2,1); z-index: 50; flex-direction: column; overflow: hidden; height: 0; }
  #sheet.peek { height: 202px; }
  #sheet.expanded { height: 84vh; }
  @media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }

  .sheet-handle { width: 38px; height: 4px; background: var(--border); border-radius: 3px; margin: 11px auto 5px; flex-shrink: 0; }
  #sheetContent { overflow-y: auto; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); flex: 1; -webkit-overflow-scrolling: touch; }

  .sheet-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; margin: 4px 0 12px; letter-spacing: -0.01em; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
  .filter-pill { flex-shrink: 0; background: var(--card); color: var(--text-muted); padding: 8px 15px; border-radius: 100px; font-size: 12px; font-weight: 500; white-space: nowrap; transition: transform 0.15s ease; border: 1px solid transparent; }
  .filter-pill:active { transform: scale(0.95); }
  .filter-pill.active { background: #FFFFFF; color: #121212; font-weight: 700; }
  .status-pill { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 500; margin-bottom: 14px; border: 1px solid var(--border); }

  .card-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .hotel-card { flex: 0 0 auto; width: 150px; text-align: left; background: var(--card); border-radius: 16px; padding: 13px 14px; scroll-snap-align: start; transition: transform 0.15s ease; }
  .hotel-card:active { transform: scale(0.96); }
  .card-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; line-height: 1.25; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
  .card-rating { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .card-price { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text); font-weight: 700; }

  .back-btn { font-size: 13.5px; font-weight: 500; color: var(--text); margin-bottom: 12px; display: inline-block; }
  .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
  .detail-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; line-height: 1.15; margin-bottom: 11px; letter-spacing: -0.01em; }
  .route-summary { display: inline-block; font-size: 12.5px; background: var(--card); color: var(--text); padding: 6px 13px; border-radius: 100px; font-weight: 500; margin-bottom: 15px; margin-right: 8px; border: 1px solid var(--border); }
  .rating-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: #FFFFFF; color: #121212; padding: 6px 13px; border-radius: 100px; font-weight: 700; margin-bottom: 15px; margin-right: 8px; }
  .hotel-description { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; margin-bottom: 18px; }
  .facilities-heading { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 11px; }
  .facilities-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 14px; margin-bottom: 20px; }
  .facility-item { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-muted); }
  .facility-item svg { width: 18px; height: 18px; color: var(--text); flex-shrink: 0; }
  .facility-item { font-size: 12.5px; font-weight: 500; color: var(--text); }
  .facility-item span { color: var(--text-muted); }

  .rooms-heading { font-size: 12.5px; color: var(--text-muted); margin-bottom: 11px; }
  .room-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
  .room-card-v2 { background: var(--card); border-radius: 18px; overflow: hidden; text-align: left; }
  .room-card-photo { width: 100%; height: 130px; position: relative; display: flex; align-items: center; justify-content: center; }
  .room-card-photo svg { width: 30px; height: 30px; opacity: 0.5; }
  .room-card-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .room-card-body { padding: 14px 16px 16px; }
  .room-card-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .room-card-beds { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .room-card-beds svg { width: 15px; height: 15px; flex-shrink: 0; }
  .room-badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .room-badge { display: flex; align-items: center; gap: 5px; background: var(--card-hi); padding: 5px 10px 5px 8px; border-radius: 100px; font-size: 10.5px; color: var(--text); }
  .room-badge svg { width: 12.5px; height: 12.5px; flex-shrink: 0; }
  .room-amenities-link { font-size: 12px; color: var(--text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; margin-bottom: 13px; display: inline-block; }
  .room-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .room-card-price { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700; }
  .room-select-btn { background: #FFFFFF; color: #121212; padding: 10px 18px; border-radius: 10px; font-size: 12.5px; font-weight: 700; transition: transform 0.15s ease; }
  .room-select-btn:active { transform: scale(0.95); }

  .room-rate-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text); font-weight: 700; margin-bottom: 13px; }
  .photo-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 17px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .room-photo { flex: 0 0 auto; width: 210px; height: 136px; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; scroll-snap-align: start; }
  .room-photo svg { width: 32px; height: 32px; opacity: 0.5; }
  .room-photo-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .time-heading { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin: 4px 0 11px; }
  .dial-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .dial { width: 150px; height: 150px; }
  .dial-label-main { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 700; fill: var(--text); }
  .dial-label-sub { font-family: 'IBM Plex Sans', sans-serif; font-size: 9px; fill: var(--text-muted); }
  .preset-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .preset-btn { flex: 1; padding: 10px 6px; border: 1.5px solid var(--border); background: var(--card); border-radius: 12px; font-size: 12.5px; font-weight: 500; color: var(--text); transition: transform 0.15s ease; }
  .preset-btn:active { transform: scale(0.96); }
  .time-row { display: flex; gap: 10px; margin-bottom: 19px; }
  .time-field { flex: 1; }
  .time-field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .time-field input { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 12px; color: var(--text); font-size: 14px; font-family: 'IBM Plex Mono', monospace; }
  .time-field input:focus { outline: none; border-color: var(--accent); }

  .price-breakdown { background: var(--card); border-radius: 14px; padding: 15px 17px; margin-bottom: 17px; }
  .price-row { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 3px 0; gap: 10px; }
  .price-row:first-child { font-weight: 700; font-size: 14px; margin-bottom: 5px; }
  .price-row.muted { color: var(--text-muted); font-size: 11.5px; }

  .reserve-btn, .receipt-btn, .ghost-btn { width: 100%; padding: 15px; border-radius: 12px; font-size: 14px; font-weight: 700; transition: transform 0.15s ease; }
  .reserve-btn:active, .receipt-btn:active, .ghost-btn:active { transform: scale(0.96); }
  .reserve-btn { background: #FFFFFF; color: #121212; }
  .receipt-btn { background: #FFFFFF; color: #121212; margin-top: 10px; }
  .ghost-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text); margin-top: 10px; font-weight: 600; font-size: 13px; padding: 12px; }
  .confirm-msg { margin-top: 13px; padding: 13px 15px; background: var(--card); color: var(--text); border-radius: 12px; font-size: 12.5px; font-weight: 500; line-height: 1.5; }
  .demo-note { margin-top: 17px; font-size: 10.5px; color: var(--text-muted); line-height: 1.4; }

  #receiptsView { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; background: var(--panel); }
  .receipts-header { display: flex; align-items: center; gap: 14px; padding: max(18px, env(safe-area-inset-top)) 20px 15px; flex-shrink: 0; }
  .receipts-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; }
  .receipts-header .back-btn { margin-bottom: 0; }
  #receiptsContent { flex: 1; overflow-y: auto; padding: 0 20px calc(26px + env(safe-area-inset-bottom)); }
  .receipts-note { font-size: 12px; color: var(--text-muted); background: var(--card); padding: 13px 15px; border-radius: 14px; margin-bottom: 17px; line-height: 1.55; }
  .receipts-empty { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 44px; }
  .receipt-card { width: 100%; text-align: left; background: var(--card); border-radius: 16px; padding: 15px 17px; margin-bottom: 11px; transition: transform 0.15s ease; }
  .receipt-card:active { transform: scale(0.98); }
  .receipt-hotel { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .receipt-room { font-size: 12.5px; color: var(--text-muted); margin-bottom: 7px; }
  .receipt-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 7px; }
  .receipt-price { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--text); font-size: 14.5px; }

  #receiptModal, #accountModal, #roomAmenitiesModal { position: fixed; inset: 0; z-index: 300; display: none; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 14px; }
  .modal-close { position: absolute; top: max(20px, env(safe-area-inset-top)); right: 20px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; background: var(--card); color: var(--text); font-size: 16px; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease; }
  .modal-close:active { transform: scale(0.9); }
  .receipt-modal-img { max-width: 340px; width: 100%; border-radius: 20px; box-shadow: 0 24px 70px rgba(0,0,0,0.7); }
  .modal-actions { width: 100%; max-width: 340px; }
  .modal-card { width: 100%; max-width: 340px; background: var(--panel); border-radius: 20px; padding: 26px 22px; position: relative; }

  #roomAmenitiesModal { align-items: stretch; justify-content: flex-end; padding: 0; }
  .amenities-sheet { background: var(--panel); border-radius: 20px 20px 0 0; max-height: 80vh; overflow-y: auto; padding: 22px 22px calc(30px + env(safe-area-inset-bottom)); position: relative; }
  .amenities-sheet h2 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; margin-bottom: 4px; padding-right: 30px; }
  .amenities-building { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
  .amenity-cat-heading { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; margin: 16px 0 8px; }
  .amenity-cat-heading:first-of-type { margin-top: 0; }
  .amenity-list { list-style: none; }
  .amenity-list li { font-size: 13px; padding: 5px 0; display: flex; align-items: center; gap: 9px; }
  .amenity-list li svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--text); }

    #accountModal { display: none; }

  .route-summary { cursor: pointer; }
  .route-summary:active { transform: scale(0.96); background: var(--card-hi); }
  .address-block { margin-bottom: 15px; margin-top: -5px; }
  .address-line { font-size: 12.5px; color: var(--text); font-weight: 500; margin-bottom: 4px; line-height: 1.4; }
  .landmarks-line { font-size: 11.5px; color: var(--text-muted); line-height: 1.45; }
</style>
</head>
<body>

<div id="errorBanner"></div>
<div id="kpToast"></div>

<div id="onboarding"><div id="onboardingContent"></div></div>

<div id="map"></div>

        const dLat=lat2-lat1, dLng=lng2-lng1, dist=Math.sqrt(dLat*dLat+dLng*dLng)||0.0001;
        const perpLat=-dLng/dist, perpLng=dLat/dist;
        const ctrlLat=(lat1+lat2)/2+perpLat*dist*curvature, ctrlLng=(lng1+lng2)/2+perpLng*dist*curvature;
        const pts=[], steps=16;
        for (let i=0;i<=steps;i++){ const t=i/steps; pts.push([(1-t)*(1-t)*lat1+2*(1-t)*t*ctrlLat+t*t*lat2,(1-t)*(1-t)*lng1+2*(1-t)*t*ctrlLng+t*t*lng2]); }
        return pts;
      }
      function simulatedRoutePoints(from, to) {
        const dLat = to.lat - from.lat, dLng = to.lng - from.lng;
        const dominant = Math.abs(dLat) > Math.abs(dLng);

        const wp2 = dominant ? { lat: from.lat + dLat*0.85, lng: from.lng + dLng*0.6 } : { lat: from.lat + dLat*0.6, lng: from.lng + dLng*0.85 };
        const segs = [[from, wp1], [wp1, wp2], [wp2, to]];
        let pts = [];
        segs.forEach(([a,b], idx) => { const c = curvedLinePoints(a, b, 0.05); pts = pts.concat(idx === 0 ? c : c.slice(1)); });

      }

      function polarToCartesian(cx, cy, r, angleDeg) { const rad = (angleDeg - 90) * Math.PI / 180; return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }; }

      }
      function hourAngle(h) { return (h / 24) * 360; }
      function timeToHourFloat(hhmm) { const parts = hhmm.split(':').map(Number); return parts[0] + parts[1]/60; }

        const startHour = timeToHourFloat(selectedStartTime), hours = slotHours();

        const night1 = arcPath(hourAngle(18), hourAngle(24), cx, cy, r);

        const selectPath = arcPath(hourAngle(startHour), hourAngle(startHour + hours), cx, cy, r);
        return `<svg viewBox="0 0 120 120" class="dial">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#FFFFFF1A" stroke-width="9" />

          <path d="${night1}" fill="none" stroke="#FFFFFF" stroke-width="9" opacity="0.12" />
          <path d="${night2}" fill="none" stroke="#FFFFFF" stroke-width="9" opacity="0.12" />

      }

      function generateReceiptCode() { const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<8;i++) c+=chars[Math.floor(Math.random()*chars.length)]; return c.slice(0,4)+'-'+c.slice(4); }

      function drawReceiptCanvas(r) {

        y+=6; ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(44,y); ctx.lineTo(W-44,y); ctx.stroke(); ctx.setLineDash([]); y+=42;

            async function fetchRealRoute(from, to) {
        const url = `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('OSRM HTTP ' + res.status);
        const data = await res.json();
        if (!data.routes || !data.routes.length) throw new Error('No route found');
        const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        const duration = data.routes[0].duration;
        return { coords, duration };
      }

      async function drawRoute(hotel) {
        try {
          if (routeLayer) map.removeLayer(routeLayer);

          let coords = [];
          let duration = null;
          let isRealRoute = false;
          const startPoint = userLocation || KINSHASA_CENTER;

          if (userLocation) {
            try {
              const realRoute = await fetchRealRoute(userLocation, hotel);
              if (realRoute && realRoute.coords.length > 0) {
                coords = realRoute.coords;
                duration = realRoute.duration;
                isRealRoute = true;
              }
            } catch (e) {
              console.warn('Real routing failed, using fallback', e);
            }
          }

          if (!isRealRoute) {
            coords = simulatedRoutePoints(startPoint, hotel);
          }

          routeLayer = L.polyline(coords, {
            color: '#FFFFFF',
            weight: 4,
            opacity: 0.9,
            dashArray: isRealRoute ? null : '2 9',
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);

          const km = haversineDistance(startPoint.lat, startPoint.lng, hotel.lat, hotel.lng);

          const el = document.getElementById('routeSummary');
          if (el) {
            let text = formatDist(km);
            if (duration) {
              const mins = Math.round(duration / 60);
              text += ` · ${mins} min`;
            } else {
              text += ' · estimation';
            }
            el.textContent = text;
          }

          const b = L.latLngBounds(coords);
          const sheetPx = Math.round(window.innerHeight * 0.84) + 20;
          map.fitBounds(b, { paddingTopLeft: [40, 90], paddingBottomRight: [40, sheetPx] });
        } catch (e) {
          console.error('drawRoute error:', e);
        }
      }

      function locateUser() {
        if (!navigator.geolocation) {
          locationState = 'unsupported';
          showToast("La géolocalisation n'est pas prise en charge par ce navigateur.");
          if (sheetMode === 'list') renderSheetList();
          return;
        }
        locationState = 'loading'; locateBtn.classList.add('loading');
        if (sheetMode === 'list') renderSheetList();
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            locateBtn.classList.remove('loading');
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            locationState = 'resolved';
            onLocationResolved();
          },
          (err) => {
            locateBtn.classList.remove('loading');
            locationState = 'denied';
            if (sheetMode === 'list') renderSheetList();
            if (err && err.code === 1) {
              showToast("Autorisation de localisation refusée. Veuillez autoriser l'accès à la position dans les paramètres de votre navigateur.");
            } else if (err && err.code === 3) {
              showToast("La localisation a expiré — la carte reste centrée sur Kinshasa.");
            } else {
              showToast("Impossible d'obtenir votre position — la carte reste centrée sur Kinshasa.");
            }
            map.setView(KINSHASA_CENTER, 13);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      }
      window.locateUser = locateUser;
      window.armManualLocation = function () {
        const pill = sheetContent.querySelector('.status-pill'); if (pill) pill.textContent = 'Touchez la carte pour définir votre position';
        map.once('click', (e) => { userLocation = { lat: e.latlng.lat, lng: e.latlng.lng }; locationState = 'resolved'; onLocationResolved(); });
      };
      function showUserMarker() {
        const icon = L.divIcon({ className: 'user-marker', html: '<div class="user-marker-wrap"><div class="user-marker-pulse"></div><div class="user-marker-dot"></div></div>', iconSize: [26,26], iconAnchor: [13,13] });
        if (userMarker) userMarker.setLatLng([userLocation.lat, userLocation.lng]); else userMarker = L.marker([userLocation.lat, userLocation.lng], { icon, interactive: false, zIndexOffset: 1000 }).addTo(map);
      }
      function onLocationResolved() {
        showUserMarker();
        map.setView([userLocation.lat, userLocation.lng], 14);
        if (sheetMode === 'list') renderSheetList();
        else if (selectedHotelId) { const hotel = HOTELS.find(h => h.id === selectedHotelId); if (hotel) drawRoute(hotel); }
      }

      window.showReceipts = async function () {
        document.getElementById('headerMenu').classList.remove('show');
        if (sheetMode !== 'hidden') closeSheet();
        document.getElementById('receiptsView').style.display = 'flex';
        let list = [];
        try { const existing = await window.storage.get('kin_requests'); if (existing && existing.value) list = JSON.parse(existing.value); } catch (e) {}
        renderReceipts(list);
      };
      window.openReservationsFromMenu = window.showReceipts;
      window.hideReceipts = function () { document.getElementById('receiptsView').style.display = 'none'; };
      function renderReceipts(list) {
        receiptsCache = list;
        const el = document.getElementById('receiptsContent');
        let html = `<p class="receipts-note">À l'entrée de l'hôtel, présentez ce reçu numérique ainsi qu'une pièce d'identité (passeport, permis de conduire, carte d'étudiant ou carte d'électeur) — pour vous et votre partenaire — pour confirmer que vous avez tous les deux 18 ans ou plus.</p>`;
        if (!list.length) html += `<p class="receipts-empty">Aucune réservation pour l'instant.</p>`;
        else html += list.slice().reverse().map(r => `
          <button class="receipt-card" onclick="viewReceiptByCode('${r.code}')">
            <p class="receipt-hotel">${r.hotel}</p>
            <p class="receipt-room">${r.room} · ${r.timeSlot || ''}</p>
            <p class="receipt-meta">${new Date(r.time).toLocaleString('fr-FR')}${r.code ? ' · ' + r.code : ''}</p>
            <p class="receipt-price">$${r.price}</p>
          </button>
        `).join('');
        el.innerHTML = html;
      }

      window.openAccountModal = function () { document.getElementById('headerMenu').classList.remove('show'); document.getElementById('accountModal').style.display = 'flex'; };
      window.closeAccountModal = function () { document.getElementById('accountModal').style.display = 'none'; };
      window.saveAccountContact = async function () {
        const contact = document.getElementById('accountContact').value.trim();
        if (!contact || !currentAccount) { closeAccountModal(); return; }
        currentAccount.contact = contact;
        try { await window.storage.set('kp_account', JSON.stringify(currentAccount)); } catch (e) { console.error(e); }
        closeAccountModal();
      };

      window.toggleHeaderMenu = function () { document.getElementById('headerMenu').classList.toggle('show'); };

      function calcAge(dobStr) { const dob=new Date(dobStr); if(isNaN(dob.getTime())) return 0; const today=new Date(); let age=today.getFullYear()-dob.getFullYear(); const m=today.getMonth()-dob.getMonth(); if(m<0||(m===0&&today.getDate()<dob.getDate())) age--; return age; }
      let obData = { username: '', birthdate: '' };
      function renderOnboarding() {
        const el = document.getElementById('onboardingContent');
        el.innerHTML = `
          <div class="ob-mark"><svg viewBox="0 0 24 24" width="22" height="22"><g fill="#121212">${ROOK_PATH}</g></svg></div>
          <p class="ob-eyebrow">Bienvenue</p>
          <h1 class="ob-title">KinPause</h1>
          <p class="ob-sub">Un espace privé pour votre temps, à Kinshasa.</p>
          <label class="ob-label">Nom d'utilisateur</label>
          <input type="text" id="obUsername" class="ob-input" placeholder="Un pseudo suffit" value="${obData.username}">
          <label class="ob-label">Date de naissance</label>
          <input type="date" id="obDob" class="ob-input" value="${obData.birthdate}">
          <div id="obError" class="ob-error"></div>
          <button class="ob-btn" onclick="obSubmit()">Continuer</button>
          <p class="ob-note">KinPause protège votre vie privée : seuls votre pseudo et votre âge sont nécessaires pour commencer. Vous pourrez créer un compte complet plus tard, si vous le souhaitez.</p>
        `;
      }
      window.obSubmit = async function () {
        const username = document.getElementById('obUsername').value.trim();
        const dob = document.getElementById('obDob').value;
        const errEl = document.getElementById('obError');
        if (!username || !dob) { errEl.textContent = 'Veuillez remplir tous les champs.'; return; }
        const age = calcAge(dob);
        if (!age || age < 18) { errEl.textContent = 'Vous devez avoir 18 ans ou plus pour utiliser KinPause.'; return; }
        errEl.textContent = '';
        currentAccount = { username, birthdate: dob, ageVerified: true };
        try { await window.storage.set('kp_account', JSON.stringify({ username, birthdate: dob, ageVerified: true, createdAt: new Date().toISOString() })); } catch (e) { console.error('Account save failed', e); }
        document.getElementById('onboarding').style.display = 'none';
        showMapView();
      };

      function showMapView() {
        document.getElementById('map').style.display = 'block';
        document.getElementById('topBar').style.display = 'flex';
        locateBtn.style.display = 'flex';
        setTimeout(() => { map.invalidateSize(); updateLabelVisibility(); }, 80);
        locateUser();
      }

      async function init() {
        let account = null;
        try { const existing = await window.storage.get('kp_account'); if (existing && existing.value) account = JSON.parse(existing.value); } catch (e) {}
        if (account && account.ageVerified) { currentAccount = account; document.getElementById('onboarding').style.display = 'none'; showMapView(); }
        else { renderOnboarding(); document.getElementById('onboarding').style.display = 'flex'; }
        const intro = document.getElementById('introOverlay'); if (intro) intro.classList.add('hide');
      }
      init();
    })();
  }
</script>
</body>
</html>
